<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .table-container {
            display: flex;
            flex-direction: row;
            gap: 24px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        /* Optional: Make both sections equal width */
        .table-container> #data-container3,
        .table-container> #data-container2 {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>

<body>
<div class="data-containers">
        <div id="table1" class="table-container">
            <div id="data-container1" class="data-container1">
                <img src="team.png" alt="Logo" class="logo-image1">
                <table id="myTable1">
                </table>
            </div>
            <div id="data-container6" class="data-container6">
                <img src="" alt="Logo" class="logo-image">
                <table id="myTable2">
                </table>
            </div>      
            <div id="data-container5" class="data-container5">
                <table id="myTable6">
                </table>
            </div>      
        </div>

        <div class="table-container">

            <div class="data-container-right1">

            </div>
        

            <div class="data-container-right">
                <img src="men.png" alt="Logo" class="logo-image2">
                <!-- <h3 class="table-text">Men's Top 8</h3> -->
                <div id="data-container3" class="data-container">
                    <table id="myTable4">
                    </table>
                </div>
            </div>

            <div class="data-container-right">
                <img src="women.png" alt="Logo" class="logo-image2">
                <!-- <h3 class="table-text">Women's Top 8</h3> -->
                <div id="data-container2" class="data-container">
                    <table id="myTable3">
                    </table>
                </div>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>

</body>

</html>
